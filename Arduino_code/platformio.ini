; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:upesy_wroom]
platform = espressif32
board = upesy_wroom
framework = arduino
lib_extra_dirs = ~/Documents/Arduino/libraries
; ESP32-HUB75-MatrixPanel-I2S-DMA's VirtualMatrixPanel_T uses `if constexpr`,
; which needs C++17 to actually behave as a compile-time branch (without this
; it still compiles, but only by luck - every branch has to independently be
; valid C++, which isn't guaranteed for all chain-type/scan-type combinations).
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
lib_deps =
	adafruit/Adafruit GFX Library
	adafruit/Adafruit BusIO
	bblanchon/ArduinoJson@^7.4.2
	mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.15
upload_speed = 460800
monitor_speed = 115200